name: CampusBook CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: API - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore API/CampusBook.slnx

      - name: Build API
        run: dotnet build API/CampusBook.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test API/CampusBook.slnx --configuration Release --no-build --no-restore

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: npm run build
        env:
          VITE_API_BASE: https://api.example.invalid
